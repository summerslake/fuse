<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fuse Multiplayer</title>
  </head>
  <body style="opacity: 0">
    <canvas id="canvas"></canvas>

    <!-- main ui -->
    <div id="top-left"></div>
    <div id="top-center"></div>
    <div id="shot-data"></div>
    <!-- same mount points as courses/index.html: this page runs the same game,
         and every UI element it builds expects its root to be here -->
    <div id="bottom-right">
      <div id="render-stats"></div>
      <div id="lm-status"></div>
    </div>

    <!-- dialogs -->
    <div id="scorecard"></div>
    <div id="hazard"></div>
    <div id="toast"></div>

    <script type="module" src="multiplayer.js"></script>
  </body>
</html>
